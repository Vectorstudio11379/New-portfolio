<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0a0a0c;">
  <defs>
    <linearGradient id="bg_f97316" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="50%" stop-color="#261309"/>
      <stop offset="100%" stop-color="#3e1f0e"/>
    </linearGradient>
    <linearGradient id="glow_f97316" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.1"/>
