      <rect x="330" y="0" width="300" height="280" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="350" y="20" width="40" height="40" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="360" y="30" width="20" height="20" rx="4" fill="#261309"/>
      <text x="350" y="95" font-family="sans-serif" font-size="18" font-weight="600" fill="#ffffff">Drone Video</text>
      <text x="350" y="125" font-family="monospace" font-size="26" font-weight="700" fill="#ffffff">4K Aerial</text>
      <text x="350" y="155" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">Prime real estate footage</text>
      <!-- Progress / Bar Stats -->
