    <rect width="1040" height="535" rx="16" fill="#0c0d12" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="1040" height="50" rx="16" fill="#14161f"/>
    <rect y="36" width="1040" height="14" fill="#14161f"/>
