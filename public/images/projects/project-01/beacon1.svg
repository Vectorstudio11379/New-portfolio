    <rect x="900" y="12" width="110" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
    <text x="955" y="29" font-family="monospace" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="1.5">REAL ESTATE</text>

