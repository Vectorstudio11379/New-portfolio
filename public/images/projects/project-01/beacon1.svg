      <rect x="680" y="20" width="40" height="40" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="700" cy="40" r="6" fill="#27c93f"/>
      <text x="680" y="95" font-family="sans-serif" font-size="18" font-weight="600" fill="#ffffff">SEO Authority</text>
      <text x="680" y="125" font-family="monospace" font-size="26" font-weight="700" fill="#27c93f">Top 3 Rank</text>
      <text x="680" y="155" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">Targeted technical search SEO</text>
      
      <!-- Tech tags inside card 3 -->
      <g transform="translate(680, 185)">
        <rect x="0" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
        <text x="40" y="17" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">React</text>

        <rect x="90" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
        <text x="130" y="17" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Next.js</text>

        <rect x="0" y="36" width="95" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
        <text x="47" y="53" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">TypeScript</text>

        <rect x="105" y="36" width="95" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
        <text x="152" y="53" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Tailwind</text>
